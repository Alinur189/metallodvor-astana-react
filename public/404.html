<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>МеталлоДвор Астана</title>
    <script>
      // spa-github-pages: GitHub Pages не отдает index.html для SPA-маршрутов,
      // поэтому 404-страница кодирует путь в query-строку и уходит на главную,
      // где index.html восстанавливает исходный URL через history.replaceState.
      // Сайт на корне домена (CNAME), поэтому pathSegmentsToKeep = 0.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
